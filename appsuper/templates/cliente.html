{% extends 'base.html' %}
{% load static %}

{% block title %}Añadir Cliente{% endblock %}

{% block content %}
<main style="max-width: 500px; margin: 40px auto; padding: 0 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Cabecera Integrada -->
  <div style="margin-bottom: 25px; text-align: center;">
    <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 5px 0; color: #212529; font-size: 28px; font-weight: 700;">
      <span>Añadir Cliente 🛒</span>
    </h2>
    <span style="background: #e9ecef; color: #495057; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; display: inline-block;">
      ID de Cliente: {{ proximo_id_cliente }}
    </span>
  </div>

  <form method="post" style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #f1f3f5;">
    {% csrf_token %}

    <!-- Nombre Completo -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">Nombre Completo</label>
      <input type="text" name="nombre" required 
      pattern=".*\s+.*" title="Debe incluir al menos un espacio en blanco (Nombre y Apellido)."
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#007bff'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
    </div>

    <!-- DNI -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">DNI</label>
      <input type="text" name="dni" required 
      minlength="8" maxlength="8" pattern="\d{8}" title="El DNI debe contener exactamente 8 números enteros."
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#007bff'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
    </div>

    <!-- Edad -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">Edad</label>
      <input type="number" name="edad" min="11" required 
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#007bff'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
    </div>

    <!-- Campo Sexo (Lista de opciones) -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">Sexo:</label>
      <select name="sexo" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: white;">
        <option value="" disabled {% if not cliente.sexo %}selected{% endif %}>Seleccione el sexo</option>
        <option value="hombre" {% if cliente.sexo == "hombre" %}selected{% endif %}>👨 Hombre</option>
        <option value="mujer" {% if cliente.sexo == "mujer" %}selected{% endif %}>👩 Mujer</option>
      </select>
    </div>


    <!-- Saldo Disponible -->
    <div style="margin-bottom: 25px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">Saldo Disponible (Dinero)</label>
      <div style="display: flex; align-items: center; width: 100%; position: relative;">
        <span style="font-weight: bold; position: absolute; left: 14px; color: #495057; font-size: 16px;">$</span>
        <input type="number" step="100" name="dinero" min="1000" required 
        style="flex: 1; padding: 10px 14px 10px 30px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; height: 44px; font-size: 15px; transition: border-color 0.2s;"
        onfocus="this.style.borderColor='#007bff'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
      </div>
    </div>

    <!-- Botones de Acción -->
    <div style="display: flex; justify-content: space-between; gap: 12px;">
      <a href="{% url 'lista_usuarios' %}" 
         style="flex: 1; text-align: center; background: #f8f9fa; color: #495057; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; border: 1px solid #dee2e6; transition: background 0.2s;"
         onmouseover="this.style.background='#e9ecef'" onmouseout="this.style.background='#f8f9fa'">Volver</a>
      <button type="submit" 
              style="flex: 1; background: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,123,255,0.15);"
              onmouseover="this.style.background='#0069d9'" onmouseout="this.style.background='#007bff'">Aceptar 💾</button>
    </div>
  </form>
</main>
{% endblock %}
