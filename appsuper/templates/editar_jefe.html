{% extends 'base.html' %}
{% load static %}

{% block title %}Modificar Jefe de Sucursal{% endblock %}

{% block content %}
<main style="max-width: 500px; margin: 40px auto; padding: 0 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  
  <!-- Cabecera Integrada -->
  <div style="margin-bottom: 25px; text-align: center;">
    <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 8px 0; color: #212529; font-size: 28px; font-weight: 700;">
      <span style="color: #b58900;">Modificar Perfil de Jefe 👑</span>
    </h2>
    <div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;">
      <span style="background: #fff3cd; color: #856404; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;">
        📍 {{ jefe.sucursal.nombre }}
      </span>
    </div>
  </div>

  <!-- Formulario de Edición -->
  <form method="post" style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #ffc107;">
    {% csrf_token %}
    
    <!-- Nombre Completo -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">Nombre Completo</label>
      <input type="text" name="nombre" value="{{ jefe.nombre_completo }}" required 
      pattern=".*\s+.*" title="Debe incluir al menos un espacio en blanco (Nombre y Apellido)."
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#ffc107'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
    </div>

    <!-- DNI -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">DNI</label>
      <input type="text" name="dni" value="{{ jefe.dni }}" required 
      minlength="8" maxlength="8" pattern="\d{8}" title="El DNI debe contener exactamente 8 números enteros."
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#ffc107'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
    </div>

    <!-- Sexo -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">Sexo</label>
      <select name="sexo" required 
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; background-color: white; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#ffc107'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
        <option value="hombre" {% if jefe.sexo_empleado == "hombre" %}selected{% endif %}>👨 Hombre</option>
        <option value="mujer" {% if jefe.sexo_empleado == "mujer" %}selected{% endif %}>👩 Mujer</option>
      </select>
    </div>
    
    <!-- Edad -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">Edad</label>
      <input type="number" name="edad" min="18" value="{{ jefe.edad }}" required 
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#ffc107'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
    </div>

    <!-- Años de Servicio -->
    <div style="margin-bottom: 25px;">
      <label style="display:block; font-weight:600; margin-bottom:8px; color: #343a40; font-size: 14px;">Años de Servicio (Antigüedad)</label>
      <input type="number" name="anos_servicio" min="0" value="{{ jefe.anos_servicio }}" required 
      style="width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s;"
      onfocus="this.style.borderColor='#ffc107'; this.style.outline='none';" onblur="this.style.borderColor='#dee2e6';">
    </div>

    <!-- Botones de Acción -->
    <div style="display: flex; justify-content: space-between; gap: 12px;">
      <a href="{% url 'lista_usuarios' %}" 
         style="flex: 1; text-align: center; background: #f8f9fa; color: #495057; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; border: 1px solid #dee2e6; transition: background 0.2s;"
         onmouseover="this.style.background='#e9ecef'" onmouseout="this.style.background='#f8f9fa'">Volver</a>
      <button type="submit" 
              style="flex: 1; background: #ffc107; color: #212529; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(255,193,7,0.15);"
              onmouseover="this.style.background='#e0a800'" onmouseout="this.style.background='#ffc107'">Aceptar 💾</button>
    </div>
  </form>
</main>
{% endblock %}
