{% extends 'base.html' %}
{% load static %}

{% block title %}Añadir Producto{% endblock %}

{% block content %}
<main style="max-width: 500px; margin: 40px auto; padding: 20px;">
  <header style="text-align: center; margin-bottom: 25px;">
    <h2 class="titulo" style="margin: 0 0 10px 0; color: #212529;">Añadir Nuevo Producto 📦</h2>
    <!-- Identificador del Sistema en formato Badge Redondeado -->
    <span style="background: #e9ecef; color: #495057; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; display: inline-block; border: 1px solid #dee2e6;">
      Próximo ID de Producto: #{{ proximo_id }}
    </span>
  </header>
  
  <!-- enctype es obligatorio para poder subir imágenes/fotos mediante el formulario -->
  <form method="post" enctype="multipart/form-data" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #dee2e6;">
    {% csrf_token %}
    
    <!-- Campo Nombre -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">Nombre del Producto:</label>
      <input type="text" name="nombre" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
    </div>

    <!-- Campo Empresa Fabricante -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">Empresa Fabricante:</label>
      <input type="text" name="empresa" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
    </div>

    <!-- Campo Categoría (Lista de opciones con íconos) -->
<div style="margin-bottom: 15px;">
  <label style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">Categoría:</label>
  <select name="categoria" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: white; height: 38px; color: #212529; cursor: pointer;">
    <option value="" disabled {% if not producto.categoria %}selected{% endif %}>Seleccione una categoría</option>
    <option value="Golosinas" {% if producto.categoria == "Golosinas" %}selected{% endif %}>🍬 Golosinas</option>
    <option value="Almacén" {% if producto.categoria == "Almacén" %}selected{% endif %}>🥫 Almacén</option>
    <option value="Bebidas" {% if producto.categoria == "Bebidas" %}selected{% endif %}>🥤 Bebidas</option>
    <option value="Lácteos" {% if producto.categoria == "Lácteos" %}selected{% endif %}>🥛 Lácteos</option>
    <option value="Perfumería" {% if producto.categoria == "Perfumería" %}selected{% endif %}>🧼 Perfumería</option>
    <option value="Limpieza" {% if producto.categoria == "Limpieza" %}selected{% endif %}>🧽 Limpieza</option>
    <option value="Otros" {% if producto.categoria == "Otros" %}selected{% endif %}>📦 Otros</option>
  </select>
</div>


        <!-- Campo Costo / Precio -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">Costo / Precio ($):</label>
      <!-- CORREGIDO: Agregado value="0.01" para arrancar en el mínimo -->
      <input type="number" min="0" step="0.01" name="costo" value="0" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
    </div>

    <!-- Campo Stock Inicial (Ya te funciona bien, lo dejamos igual) -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">Stock Inicial:</label>
      <input type="number" name="stock" min="1" value="1" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
    </div>

    <!-- Campo Peso -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">Peso (kg):</label>
      <!-- CORREGIDO: Agregado value="0.01" para arrancar en el mínimo -->
      <input type="number" step="0.01" min="0" name="peso" value="0" required style="width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
    </div>


    <!-- Control de Imagen Actual y Nueva Vista Previa Unificado -->
    <div style="margin-bottom: 20px;" id="contenedor-vista-previa">
      <span id="titulo-imagen-estado" style="display:block; font-weight:bold; margin-bottom:5px; color: #495057;">
        Sin imagen seleccionada
      </span>
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px; background: #f8f9fa; border-radius: 4px; border: 1px solid #e9ecef;">
        
        <!-- Miniatura dinámica inicializada con la silueta estática por defecto -->
        <img id="img-vista-previa" 
             src="{% static 'appsuper/sin_foto.png' %}" 
             alt="Vista previa" 
             style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px; display: none;">
        
        <!-- Texto dinámico inicializado en vacío -->
        <span id="texto-nombre-archivo" style="font-size: 12px; color: #6c757d; word-break: break-all;">
          No hay ninguna foto asociada al artículo.
        </span>
      </div>
    </div>

    <!-- Botonera Inferior Unificada (3 Columnas con la misma altura) -->
    <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 25px; align-items: center;">
      
      <!-- 1. Botón Volver / Cancelar -->
      <a href="{% url 'lista_productos' %}" style="flex: 1; text-align: center; background: #6c757d; color: white; padding: 10px 0; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; line-height: 20px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
        Volver
      </a>

      <!-- 2. Botón Seleccionar Imagen (Estilizado en azul) -->
      <label style="flex: 1; text-align: center; background: #007bff; color: white; padding: 10px 0; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; transition: background 0.2s;"
        onmouseover="this.style.backgroundColor='#0069d9'" onmouseout="this.style.backgroundColor='#007bff'">
        Subir Foto 📷
        <input type="file" name="imagen" id="input-imagen" accept="image/*" style="display: none;" onchange="actualizarVistaPrevia(this)">
      </label>

      <!-- 3. Botón Aceptar / Confirmar (Estilizado en verde) -->
      <button type="submit" style="flex: 1; background: #28a745; color: white; border: none; padding: 10px 0; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; transition: background 0.2s;"
        onmouseover="this.style.backgroundColor='#218838'" onmouseout="this.style.backgroundColor='#28a745'">
        Aceptar 💾
      </button>

    </div>
  </form>
</main>

<!-- SCRIPT EN JAVASCRIPT CORREGIDO -->
<script>
function actualizarVistaPrevia(input) {
  const archivo = input.files[0];
  const txtNombreMini = document.getElementById('texto-nombre-archivo');
  const imgElement = document.getElementById('img-vista-previa');
  const tituloEstado = document.getElementById('titulo-imagen-estado');

  if (archivo) {
    // 1. Cambiamos el texto de la píldora interna y el título superior
    txtNombreMini.innerText = "Nueva imagen: " + archivo.name;
    tituloEstado.innerText = "Nueva Imagen Seleccionada:";

    // 2. Leemos el archivo en memoria para inyectarlo en el <img> localmente
    const lector = new FileReader();
    lector.onload = function(e) {
      imgElement.src = e.target.result;
      imgElement.style.display = "block"; // Volvemos visible la miniatura
    }
    lector.readAsDataURL(archivo);
  }
}
</script>
{% endblock %}
