{% extends 'base.html' %}
{% load static %}

{% block title %}Modificar Empleado{% endblock %}

{% block content %}
<main style="max-width: 500px; margin: 40px auto; padding: 20px;">
  <h2 class="titulo">Modificar Perfil 🧑‍💼</h2>

  <!-- Título e ID alineados en la misma fila como texto plano -->
  <span style="color: #6c757d; font-size: 24px; font-weight: normal;">(ID del empleado: {{ empleado.id_empleado }})</span>
  
  <form method="post" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    {% csrf_token %}
    
    <!-- Nombre Completo con validación de espacio -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Nombre Completo:</label>
      <input type="text" name="nombre" value="{{ empleado.nombre }}" required 
      pattern=".*\s+.*" title="Debe incluir al menos un espacio en blanco (Nombre y Apellido)."
      style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>
    
    <!-- DNI con validación estricta de 8 dígitos numéricos -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">DNI:</label>
      <input type="text" name="dni" value="{{ empleado.dni }}" required 
      minlength="8" maxlength="8" pattern="\d{8}" title="El DNI debe contener exactamente 8 números enteros."
      style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Edad (Mínimo 16 años):</label>
      <input type="number" name="edad" min="16" value="{{ empleado.edad }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <!-- Campo Sexo (Lista de opciones) -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #212529;">Sexo:</label>
      <select name="sexo" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: white;">
        <option value="" disabled {% if not empleado.sexo %}selected{% endif %}>Seleccione el sexo</option>
        <option value="hombre" {% if empleado.sexo == "hombre" %}selected{% endif %}>👨 Hombre</option>
        <option value="mujer" {% if empleado.sexo == "mujer" %}selected{% endif %}>👩 Mujer</option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Años de Servicio:</label>
      <input type="number" name="anos_servicio" value="{{ empleado.anos_servicio }}" min="0" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Sueldo:</label>
      <div style="display: flex; align-items: center; width: 100%;">
        <span style="font-weight: bold; margin-right: 8px; color: #495057; font-size: 16px;">$</span>
        <input type="number" step="1" name="sueldo" value="{{ empleado.sueldo|stringformat:'d' }}" min="100" required style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; height: 38px;">
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; gap: 10px;">
      <!-- CORREGIDO: Redirección directa hacia la tarjeta técnica del empleado en edición -->
      <a href="{% url 'detalle_empleado' empleado.id_empleado %}" style="flex: 1; text-align: center; background: #6c757d; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold;">Volver</a>
      <!-- 🏢 NUEVO BOTÓN: Cambiar Sucursal -->
      <button type="submit" style="flex: 1; background: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">Aceptar 💾</button>
    </div>
  </form>
</main>
{% endblock %}
