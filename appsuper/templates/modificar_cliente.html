{% extends 'base.html' %}
{% load static %}

{% block title %}Modificar Cliente{% endblock %}

{% block content %}
<main style="max-width: 500px; margin: 40px auto; padding: 20px;">
  <h2 class="titulo">Modificar Perfil 🛒</h2>
  
  <!-- Título e ID alineados en la misma fila como texto plano -->
  <span style="color: #6c757d; font-size: 24px; font-weight: normal;">(ID del cliente: {{ cliente.id_cliente }})</span>

  <form method="post" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    {% csrf_token %}

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Nombre Completo:</label>
      <!-- Validación de espacio obligatorio -->
      <input type="text" name="nombre" value="{{ cliente.nombre }}" required 
      pattern=".*\s+.*" title="Debe incluir al menos un espacio en blanco (Nombre y Apellido)."
      style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">DNI:</label>
      <!-- Validación estricta de exactamente 8 dígitos numéricos -->
      <input type="text" name="dni" value="{{ cliente.dni }}" required 
      minlength="8" maxlength="8" pattern="\d{8}" title="El DNI debe contener exactamente 8 números enteros."
      style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Edad:</label>
      <input type="number" name="edad" min="11" value="{{ cliente.edad }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <!-- Campo Sexo (Lista de opciones) -->
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px; color: #212529;">Sexo:</label>
      <select name="sexo" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: white;">
        <option value="" disabled {% if not cliente.sexo %}selected{% endif %}>Seleccione el sexo</option>
        <option value="hombre" {% if cliente.sexo == "hombre" %}selected{% endif %}>👨 Hombre</option>
        <option value="mujer" {% if cliente.sexo == "mujer" %}selected{% endif %}>👩 Mujer</option>
      </select>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Saldo Disponible (Dinero):</label>
      <div style="display: flex; align-items: center; width: 100%;">
        <span style="font-weight: bold; margin-right: 8px; color: #495057; font-size: 16px;">$</span>
        <input type="number" step="1" name="dinero" value="{{ cliente.dinero|stringformat:'d' }}" required style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; height: 38px;">
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; gap: 10px;">
      <!-- CORREGIDO: Ahora te redirige de vuelta a la ficha de detalle de este cliente -->
      <a href="{% url 'detalle_cliente' cliente.id_cliente %}" style="flex: 1; text-align: center; background: #6c757d; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold;">Volver</a>
      <button type="submit" style="flex: 1; background: #007bff; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">Aceptar 💾</button>
    </div>
  </form>
</main>
{% endblock %}
